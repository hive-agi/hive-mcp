name: CI

on:
  push:
    # staging is a GATE, not a mirror. Without it here, landing on staging ran
    # nothing, so "merge staging, then promote to main if CI is green" had no
    # CI to be green: the first real signal arrived only once main had already
    # taken the change. release.yml deliberately still lists main alone, so
    # staging is where the suite runs and never where a version is published.
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - 'resources/presets/**'
      - 'docs/**'
  pull_request:
    # PRs INTO staging need the same gate, or a promotion PR is first graded
    # only on its eventual PR into main.
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - 'resources/presets/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  lint:
    name: clj-kondo Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: '1.12.5.1664'
          clj-kondo: '2026.07.24'

      # test-swarm/ is linted here although :test-unit never loads it: the
      # lint is static, so it needs no swarm addon on a classpath.
      - name: Lint with clj-kondo
        run: |
          clj-kondo --lint src test test-swarm \
            --config-dir .clj-kondo \
            --fail-level error

  test:
    name: Unit Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        java: ['21']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: '1.12.5.1664'

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            clj-${{ runner.os }}-

      - name: Download dependencies
        run: clojure -P -M:test-unit

      # The runner's exit code folds a namespace LOAD abort into the same 1 as
      # an ordinary red test, and a run that silently dropped namespaces can
      # still print a plausible summary. bin/test-count-floor.sh judges the
      # saved log instead: load abort (exit 2), suite below the committed
      # test/assertion floor (exit 3), red tests (exit 1).
      - name: Run unit tests
        run: |
          set +e
          clojure -M:test-unit 2>&1 | tee unit-tests.log
          rc=${PIPESTATUS[0]}
          set -e
          bin/test-count-floor.sh unit-tests.log "$rc"
        env:
          # Suppress Netty warnings in CI
          JVM_OPTS: >-
            --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
            --add-opens=java.base/java.nio=ALL-UNNAMED
            -Dio.netty.tryReflectionSetAccessible=true

  # bin/hive-mcp's OOM wiring, driven with a stub `clojure` (no JVM). The
  # scope assertions skip themselves when the runner has no systemd user
  # manager; the restart, exit-status, OOMD_PREF=off and SIGTERM cases run.
  launcher:
    name: Launcher (bin/hive-mcp)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bin/hive-mcp is now a shim that execs `bb -m hive-mcp.launch.main`, so
      # bb must be on PATH BEFORE the launcher test drives it. It used to be
      # installed further down, for `bb test:launch` alone; the launcher test
      # now needs it too, and a launcher test that fails on a missing bb would
      # be measuring the runner, not the launcher.
      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          bb: 'latest'

      - name: Run launcher test
        run: timeout 300 bin/hive-mcp-launcher-test.sh

      - name: Test-count gate self-test
        run: timeout 60 bin/test-count-floor-test.sh

      - name: Signed-push hook self-test
        run: timeout 60 bin/pre-push-signed-test.sh

      # The :launch planner (schema, defaults, knobs, plan) runs under bb, so
      # its suite needs no JVM and no build. It is gated here because the argv
      # the planner produces is what this job's launcher test drives.
      - name: Launch config tests (bb)
        run: timeout 120 bb test:launch

      # Every :test* alias in deps.edn must state an -Xmx heap ceiling.
      - name: Test heap-cap check
        run: |
          timeout 60 bin/test-heap-cap-check.bb --self-test
          timeout 60 bin/test-heap-cap-check.bb deps.edn

  deps:
    name: Dependency Resolution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: '1.12.5.1664'

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            clj-${{ runner.os }}-

      - name: Resolve all dependencies
        run: clojure -P -M:dev:test

      - name: Print classpath (debug)
        run: clojure -Spath | tr ':' '\n' | head -30

  boot:
    # Resolution is not compilation. `clojure -P` succeeds against a jar that
    # does not carry the var the source calls, and every workstation hides the
    # gap behind a gitignored local.deps.edn full of :local/root siblings.
    # This job loads the server closure from the COMMITTED deps.edn only.
    name: Boot From Published Deps
    runs-on: ubuntu-latest
    needs: [deps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: '1.12.5.1664'

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            clj-${{ runner.os }}-

      - name: Load the bare core
        run: clojure -J-Xmx2g -M:mcp -e "(require 'hive-mcp.server.core) (println :core-loaded)"

      - name: Load the starter pack
        run: |
          clojure -Sdeps "$(cat starter.deps.edn)" -J-Xmx2g -M:mcp \
            -e "(require 'hive-mcp.server.core) (println :starter-loaded)"
